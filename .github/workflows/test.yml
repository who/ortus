name: test

on:
  push:
    # ortus/** is the issue-branch namespace: every finalized candidate lands
    # on ortus/<issue-id> first, and running the same gate there is what lets
    # a later phase make the merge wait for the result (ortus-6a0a.1).
    # Unrelated local branches stay untriggered.
    branches: [main, 'ortus/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv dropped moving major tags at v8; only full-version tags resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install bd (beads)
        run: |
          # Pinned per project convention. The release tag is `v1.2.1` but the
          # asset filenames embed the bare version `1.2.1` (no `v`).
          BD_VERSION="1.2.1"
          case "${{ runner.os }}" in
            Linux)
              ASSET="beads_${BD_VERSION}_linux_amd64.tar.gz"
              ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then
                ASSET="beads_${BD_VERSION}_darwin_arm64.tar.gz"
              else
                ASSET="beads_${BD_VERSION}_darwin_amd64.tar.gz"
              fi
              ;;
          esac
          URL="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/${ASSET}"
          echo "Downloading $URL"
          # --fail so a 404 exits non-zero instead of silently writing an HTML
          # error page that tar later chokes on with a cryptic message.
          curl --fail -L -o /tmp/bd.tar.gz "$URL"
          sudo tar -xzf /tmp/bd.tar.gz -C /usr/local/bin
          bd --version

      # CodeGraph ships as a node package with a bounded engine range (1.4.1
      # declared >=20 <25) and the runner's default node drifts, so it is
      # pinned here rather than inherited.
      - name: Set up Node (CodeGraph engine range)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install CodeGraph
        run: |
          # Pinned like bd.
          npm install --global @colbymchenry/codegraph@1.5.0
          codegraph --version

      - name: Build the CodeGraph index
        run: |
          # `.codegraph/` is gitignored, so a fresh checkout has no index and
          # required mode would abort. The `-i` flag is a deprecated no-op on
          # 1.5.0 — indexing runs by default. A full index of this repo is
          # 129 files / ~0.2s locally, so it is cheap enough for every leg.
          codegraph init .
          codegraph status

      - name: Install sandbox prereq (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Create venv (matrix Python)
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install editable + dev deps
        run: uv pip install -e '.[dev]'

      - name: Run comprehensive hermetic pytest gate
        env:
          # Hosted runners vary by ~3x run to run, so the tight local duration
          # budget measures the machine here rather than the test. The guard
          # stays on — a pathological test still trips 15s — without a healthy
          # one reddening main because the runner was slow.
          ORTUS_TEST_BUDGET_SCALE: '3'
        run: |
          uv run pytest -m "fast or integration" \
            --test-timeout=180 --enforce-duration-budget --durations=20 \
            --junitxml=junit.xml \
            --cov=ortus --cov-report=xml --cov-report=term

      - name: Upload pytest timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn

      - name: Upload coverage artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  release-smoke:
    name: tagged network + live-provider smoke
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv dropped moving major tags at v8; only full-version tags resolve.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install bd (beads)
        run: |
          BD_VERSION="1.2.1"
          curl --fail -L -o /tmp/bd.tar.gz \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/bd.tar.gz -C /usr/local/bin

      - name: Set up Node (CodeGraph engine range)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install CodeGraph
        run: |
          npm install --global @colbymchenry/codegraph@1.5.0
          codegraph --version

      - name: Build the CodeGraph index
        run: |
          codegraph init .
          codegraph status

      - name: Install sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install editable + dev dependencies
        run: uv sync --extra dev

      - name: Configure optional provider credentials
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$CLAUDE_CREDENTIALS_JSON" ]; then
            npm install --global @anthropic-ai/claude-code
            mkdir -p "$HOME/.claude"
            printf '%s' "$CLAUDE_CREDENTIALS_JSON" > "$HOME/.claude/.credentials.json"
            chmod 600 "$HOME/.claude/.credentials.json"
          fi

      - name: Run external release smoke
        run: |
          uv run pytest -m "network or live_provider" \
            --test-timeout=900 --durations=20 --junitxml=release-junit.xml

      - name: Upload release timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-junit
          path: release-junit.xml
          if-no-files-found: warn
